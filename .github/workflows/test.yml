name: tests

on:
  push:
  pull_request:

jobs:
  model-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Model routing tests (fixtures only)
        run: python3 -m unittest discover -s tests -v
